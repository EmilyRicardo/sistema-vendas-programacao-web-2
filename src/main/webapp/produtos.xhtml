<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces" xmlns:f="jakarta.faces.core" template="/template.xhtml">
    <ui:define name="titulo">Produtos | Vértice</ui:define><ui:define name="cabecalho">Produtos</ui:define>
    <ui:define name="conteudo">
        <div class="page-intro"><div><h2>Catálogo de produtos</h2><p>Controle preços, estoque, marca, categoria e imagem do produto.</p></div><h:form id="produtoToolbarForm"><p:commandButton value="Novo produto" icon="pi pi-plus" styleClass="primary-button" actionListener="#{produtoController.novo}" update=":produtoForm" oncomplete="PF('produtoDialog').show()" /></h:form></div>
        <h:form id="produtoTableForm">
            <p:dataTable id="tabelaProdutos" value="#{produtoController.produtos}" var="p" paginator="true" rows="10" rowsPerPageTemplate="5,10,20,50" paginatorPosition="bottom" sortMode="multiple" emptyMessage="Nenhum produto cadastrado." styleClass="data-table product-table" reflow="true">
                <p:column headerText="Produto" sortBy="#{p.nome}" filterBy="#{p.nome}" filterMatchMode="contains"><div class="product-cell"><p:graphicImage value="#{request.contextPath}/imagens/#{p.caminhoImagem}" rendered="#{not empty p.caminhoImagem}" styleClass="product-thumb" cache="false"/><h:panelGroup layout="block" rendered="#{empty p.caminhoImagem}" styleClass="thumb-placeholder"><i class="pi pi-image"></i></h:panelGroup><div><h:outputText value="#{p.nome}" styleClass="cell-strong"/><small><h:outputText value="#{empty p.descricao ? 'Sem descrição' : p.descricao}" /></small></div></div></p:column>
                <p:column headerText="Marca" sortBy="#{p.marca.nome}" filterBy="#{p.marca.nome}" filterMatchMode="contains"><h:outputText value="#{p.marca.nome}" /></p:column>
                <p:column headerText="Categoria" sortBy="#{p.categoria.nome}" filterBy="#{p.categoria.caminhoHierarquico}" filterMatchMode="contains"><h:outputText value="#{p.categoria.caminhoHierarquico}" /></p:column>
                <p:column headerText="Preço" sortBy="#{p.preco}" styleClass="number-cell"><h:outputText value="#{produtoController.formatarPreco(p.preco)}" /></p:column>
                <p:column headerText="Estoque" sortBy="#{p.quantidadeEstoque}" styleClass="number-cell"><h:outputText value="#{p.quantidadeEstoque}" styleClass="stock-pill" /></p:column>
                <p:column headerText="Ações" styleClass="actions-column" exportable="false"><p:commandButton icon="pi pi-pencil" title="Editar" styleClass="ui-button-text-only action-button" actionListener="#{produtoController.editar(p)}" update=":produtoForm" oncomplete="PF('produtoDialog').show()"/><p:commandButton icon="pi pi-trash" title="Excluir" styleClass="ui-button-text-only action-button danger-action" actionListener="#{produtoController.excluir(p)}" update=":growl :produtoTableForm:tabelaProdutos"><p:confirm header="Confirmar exclusão" message="Deseja excluir este produto? Esta ação não pode ser desfeita." icon="pi pi-exclamation-triangle" /></p:commandButton></p:column>
            </p:dataTable>
        </h:form>
        <p:dialog id="produtoDialog" widgetVar="produtoDialog" header="Dados do produto" modal="true" responsive="true" width="760" closeOnEscape="true" resizable="false">
            <h:form id="produtoForm" enctype="multipart/form-data">
                <div class="form-grid two-cols"><div class="field full"><p:outputLabel for="nome" value="Nome do produto *"/><p:inputText id="nome" value="#{produtoController.produto.nome}" required="true" requiredMessage="Informe o nome do produto." maxlength="160" placeholder="Ex.: Fone sem fio" styleClass="w-full"/><p:message for="nome" /></div>
                <div class="field"><p:outputLabel for="preco" value="Preço (R$) *"/><p:inputNumber id="preco" value="#{produtoController.produto.preco}" required="true" requiredMessage="Informe o preço." minValue="0.01" decimalPlaces="2" decimalSeparator="," thousandSeparator="." symbol="R$ " symbolPosition="p" styleClass="w-full"/><p:message for="preco" /></div>
                <div class="field"><p:outputLabel for="estoque" value="Quantidade em estoque *"/><p:inputNumber id="estoque" value="#{produtoController.produto.quantidadeEstoque}" required="true" requiredMessage="Informe o estoque." minValue="0" decimalPlaces="0" thousandSeparator="." styleClass="w-full"/><p:message for="estoque" /></div>
                <div class="field"><p:outputLabel for="marca" value="Marca *"/><p:selectOneMenu id="marca" value="#{produtoController.produto.marca}" converter="marcaConverter" required="true" requiredMessage="Selecione a marca." styleClass="w-full"><f:selectItem itemLabel="Selecione uma marca" itemValue="" noSelectionOption="true"/><f:selectItems value="#{produtoController.marcasAtivas}" var="m" itemValue="#{m}" itemLabel="#{m.nome}"/></p:selectOneMenu><p:message for="marca" /></div>
                <div class="field"><p:outputLabel for="categoria" value="Categoria *"/><p:selectOneMenu id="categoria" value="#{produtoController.produto.categoria}" converter="categoriaConverter" required="true" requiredMessage="Selecione a categoria." styleClass="w-full"><f:selectItem itemLabel="Selecione uma categoria" itemValue="" noSelectionOption="true"/><f:selectItems value="#{produtoController.categoriasHierarquicas}"/></p:selectOneMenu><p:message for="categoria" /></div>
                <div class="field full"><p:outputLabel for="descricao" value="Descrição"/><p:inputTextarea id="descricao" value="#{produtoController.produto.descricao}" rows="3" autoResize="false" placeholder="Detalhes opcionais sobre o produto" styleClass="w-full"/></div>
                <div class="field full upload-field"><p:outputLabel value="Imagem do produto (JPG, PNG ou WEBP; até 5 MB)"/><div class="upload-row"><p:fileUpload id="imagem" mode="advanced" auto="true" listener="#{produtoController.upload}" accept=".jpg,.jpeg,.png,.webp" allowTypes="/(\.|\/)(jpe?g|png|webp)$/" sizeLimit="5242880" invalidSizeMessage="A imagem deve ter até 5 MB." invalidFileMessage="Use JPG, PNG ou WEBP." update=":growl imagemAtual :produtoForm" label="Escolher imagem" uploadLabel="Enviar" cancelLabel="Cancelar"/><h:panelGroup id="imagemAtual" layout="block" styleClass="image-preview"><p:graphicImage value="#{request.contextPath}/imagens/#{produtoController.produto.caminhoImagem}" rendered="#{not empty produtoController.produto.caminhoImagem}" styleClass="preview-img" cache="false"/><h:panelGroup layout="block" rendered="#{empty produtoController.produto.caminhoImagem}" styleClass="preview-empty"><i class="pi pi-image"></i> Prévia da imagem</h:panelGroup></h:panelGroup></div></div></div>
                <div class="dialog-actions"><p:commandButton value="Cancelar" actionListener="#{produtoController.cancelarEdicao}" process="@this" update="produtoForm" oncomplete="PF('produtoDialog').hide()" styleClass="secondary-button"/><p:commandButton value="Salvar produto" icon="pi pi-check" action="#{produtoController.salvar}" update=":growl :produtoTableForm:tabelaProdutos produtoForm" oncomplete="if (!args.validationFailed) PF('produtoDialog').hide()" styleClass="primary-button" /></div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
